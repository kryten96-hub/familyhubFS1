  --bd: rgba(156, 161, 186, 0.15);
  --bd-strong: rgba(156, 161, 186, 0.3);
  --dn: #ffb4ab;
  --dn-bg: #93000a;
  --dn-tx: #ffdad6;
  --fld: #151821;
  --hdr: #1f2230;
  --hx: #e4e6f4;
  --hero-grad: linear-gradient(135deg, #21284a 0%, #2b2447 55%, #1c3438 100%);
  --hero-tx: #eef0ff;
  --hero-sub: #b8bfe0;
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.4);
  --t-shop-bg: #232a55; --t-shop-fg: #aab4ff; --t-shop-bd: rgba(170, 180, 255, 0.24);
  --t-cal-bg: #232a55; --t-cal-fg: #aab4ff; --t-cal-bd: rgba(170, 180, 255, 0.24);
  --t-bins-bg: #232a55; --t-bins-fg: #aab4ff; --t-bins-bd: rgba(170, 180, 255, 0.24);
  --t-ch-bg: #232a55; --t-ch-fg: #aab4ff; --t-ch-bd: rgba(170, 180, 255, 0.24);
  --t-ml-bg: #232a55; --t-ml-fg: #aab4ff; --t-ml-bd: rgba(170, 180, 255, 0.24);
  --t-info-bg: #232a55; --t-info-fg: #aab4ff; --t-info-bd: rgba(170, 180, 255, 0.24);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 15px/1.45 "Google Sans", "Plus Jakarta Sans", Roboto, system-ui, -apple-system, sans-serif;
  letter-spacing: -0.005em;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  transition: background-color 0.25s ease, color 0.2s ease;
}
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 16px 16px 32px;
}
@media (min-width: 650px) {
  main {
    padding: 24px 28px 40px;
  }
}
.ms-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex: none;
  vertical-align: middle;
}
.ms-icon svg {
  width: 100%;
  height: 100%;
  fill: currentColor;
  display: block;
}
.hdr-icon {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  background: var(--ac2);
  color: var(--on-ac2);
  display: inline-grid;
  place-items: center;
  flex: none;
}
.hdr-icon .ms-icon {
  width: 22px;
  height: 22px;
}
#s-shop .hdr-icon { background: var(--t-shop-bg); color: var(--t-shop-fg); }
#s-cal .hdr-icon  { background: var(--t-cal-bg);  color: var(--t-cal-fg); }
#s-info .hdr-icon { background: var(--t-info-bg); color: var(--t-info-fg); }
#s-meals .hdr-icon { background: var(--t-ml-bg);   color: var(--t-ml-fg); }
#s-chores .hdr-icon { background: var(--t-ch-bg); color: var(--t-ch-fg); }
#s-shop h2 { color: var(--t-shop-fg); }
#s-cal h2  { color: var(--t-cal-fg); }
#s-bins h2 { color: var(--t-bins-fg); }
#s-info h2 { color: var(--t-info-fg); }
#s-meals h2 { color: var(--t-ml-fg); }
#s-chores h2 { color: var(--t-ch-fg); }
.center-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px 0 12px;
}
.btn-add-main {
  background: var(--ac) !important;
  color: var(--on-ac) !important;
  padding: 12px 28px !important;
  min-height: 46px !important;
  font-size: 14.5px !important;
  font-weight: 700 !important;
  border-radius: 999px !important;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--ac) 30%, transparent);
  gap: 8px !important;
}
#s-bins .btn-add-main { background: var(--t-bins-fg) !important; color: #fff !important; box-shadow: 0 4px 14px var(--t-bins-bd); }
#s-info .btn-add-main { background: var(--t-info-fg) !important; color: #fff !important; box-shadow: 0 4px 14px var(--t-info-bd); }
#s-cal .btn-add-main  { background: var(--t-cal-fg) !important;  color: #fff !important; box-shadow: 0 4px 14px var(--t-cal-bd); }
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 75;
  background: rgba(15, 18, 28, 0.52);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.on {
  display: flex;
  animation: fadeIn 0.18s ease;
}
.modal-card {
  width: 100%;
  max-width: 480px;
  max-height: calc(100dvh - 36px);
  overflow-y: auto;
  background: var(--card-elevated);
  border: 1px solid var(--bd-strong);
  border-radius: 28px;
  padding: 22px 20px 20px;
  box-shadow: var(--shadow-md);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.modal-head h3 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.modal-grid .full {
  grid-column: 1 / -1;
}
.modal-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.modal-field > span {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--mu);
  padding-left: 4px;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid var(--bd);
}
.info-card {
  border-left: 5px solid var(--t-info-bd);
}
.info-card.pinned {
  background: color-mix(in srgb, var(--t-info-bg) 48%, var(--card-elevated));
  border-color: var(--t-info-bd);
  border-left: 5px solid var(--t-info-fg);
}
.pin-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--t-info-bg);
  color: var(--t-info-fg);
}
.pin-badge .ms-icon {
  width: 13px;
  height: 13px;
}
button.x.pin-on {
  color: var(--t-info-fg);
  background: var(--t-info-bg);
}
.cal-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.seg-group {
  display: inline-flex;
  background: var(--surface-low);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.seg-btn {
  padding: 6px 14px !important;
  min-height: 32px !important;
  font-size: 12.5px !important;
  font-weight: 700 !important;
  background: transparent !important;
  color: var(--mu) !important;
  border-radius: 999px !important;
}
.seg-btn.on {
  background: var(--t-cal-fg) !important;
  color: #fff !important;
  box-shadow: var(--shadow-sm);
}
.cal-filter-sel {
  min-height: 38px !important;
  padding: 6px 12px !important;
  font-size: 13px !important;
  font-weight: 600;
  border-radius: 999px !important;
  background: var(--card-elevated) !important;
  border: 1px solid var(--bd) !important;
}
.cal-day-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 20px 4px 10px;
}
.cal-day-bar h2 {
  margin: 0 !important;
  font-size: 14px !important;
}
h1 {
  font-size: clamp(24px, 4.8vw, 31px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 6px 2px 18px;
  padding-right: 52px;
  color: var(--tx);
  display: flex;
  align-items: center;
  gap: 12px;
}
h2 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ac);
  margin: 24px 4px 10px;
  display: flex;
  align-items: center;
  gap: 7px;
}
p {
  margin: 8px 0;
}
.mu {
  color: var(--mu);
  font-size: 13.5px;
  font-weight: 400;
}
.done {
  text-decoration: line-through;
  color: var(--mu);
  opacity: 0.72;
}
a {
  color: var(--ac);
}
.sec {
  display: none;
  animation: fadeIn 0.2s cubic-bezier(0.2, 0, 0, 1);
}
.sec.on {
  display: block;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.panel {
  background: transparent;
  padding: 0;
}
.card {
  background: var(--card-elevated);
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 14px 16px;
  margin-bottom: 9px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.row > * {
  min-width: 0;
}
.grow {
  flex: 1;
}
.form {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
  background: var(--surface-low);
  border: 1px solid var(--bd);
  padding: 14px;
  border-radius: 26px;
}
.form input[type="text"],
.form input:not([type]) {
  flex: 1;
  min-width: 140px;
}
input,
select,
textarea {
  font: inherit;
  color: var(--tx);
  background: var(--fld);
  border: 1px solid var(--bd-strong);
  border-radius: 16px;
  padding: 11px 15px;
  min-height: 46px;
  max-width: 100%;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
textarea {
  width: 100%;
  min-height: 88px;
  resize: vertical;
}
input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 22%, transparent);
}
input[type="checkbox"] {
  width: 22px;
  height: 22px;
  min-height: 22px;
  padding: 0;
  border-radius: 7px;
  accent-color: var(--ac);
  flex: none;
  cursor: pointer;
}
button {
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 999px;
  border: 1px solid transparent;
  background: var(--ac2);
  color: var(--on-ac2);
  padding: 9px 18px;
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), filter 0.15s ease, background-color 0.15s ease;
  user-select: none;
}
button:hover {
  filter: brightness(0.97);
}
button:active {
  transform: scale(0.96);
}
button.p {
  background: var(--ac);
  color: var(--on-ac);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--ac) 28%, transparent);
}
button.x {
  border: 0;
  background: transparent;
  color: var(--mu);
  padding: 6px;
  min-height: 34px;
  min-width: 34px;
  border-radius: 50%;
}
button.x:hover {
  background: color-mix(in srgb, var(--mu) 14%, transparent);
  color: var(--tx);
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar {
  display: none;
}
#prods {
  flex-wrap: wrap;
  overflow: visible;
  margin-bottom: 10px;
}
.chip {
  white-space: nowrap;
  padding: 8px 14px;
  min-height: 36px;
  font-size: 13px;
  font-weight: 600;
  border-radius: 999px;
  background: var(--card-elevated);
  color: var(--tx);
  border: 1px solid var(--bd);
  flex: none;
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip .ms-icon {
  width: 17px;
  height: 17px;
  color: var(--ac);
}
.chip.on,
#cats .chip.on {
  background: var(--ac);
  color: var(--on-ac);
  border-color: var(--ac);
}
.chip.on .ms-icon,
#cats .chip.on .ms-icon {
  color: var(--on-ac);
}
.chip-del {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  margin-left: 2px;
  background: rgba(0, 0, 0, 0.12);
}
.dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex: none;
  display: inline-block;
}
.pdot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 4px;
}
.badge {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--ac2);
  color: var(--on-ac2);
  white-space: nowrap;
}
.badge.hot {
  background: var(--dn-bg);
  color: var(--dn-tx);
}
#s-today > h1 {
  display: none;
}
.home-hero {
  background: var(--hero-grad);
  border: 1px solid var(--bd);
  border-radius: 30px;
  padding: 22px 64px 22px 22px;
  margin: 2px 0 14px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.home-hero::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  right: -45px;
  top: -75px;
  background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 70%);
  pointer-events: none;
}
.home-kicker {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ac);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.home-kicker .ms-icon {
  width: 16px;
  height: 16px;
}
.home-title {
  font-size: clamp(24px, 4.8vw, 30px);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.12;
  color: var(--hero-tx);
  display: flex;
  align-items: center;
  gap: 8px;
}
.home-title .ms-icon {
  width: 26px;
  height: 26px;
  color: #e59400;
}
.home-sub {
  font-size: 13.5px;
  color: var(--hero-sub);
  margin-top: 5px;
  font-weight: 500;
}
.home-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 0 0 14px;
}
.home-stat {
  background: var(--card-elevated);
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 13px 14px;
  min-width: 0;
  box-shadow: var(--shadow-sm);
}
.home-stat.st-shop { background: color-mix(in srgb, var(--t-shop-bg) 55%, var(--card-elevated)); border-color: var(--t-shop-bd); }
.home-stat.st-shop .num { color: var(--t-shop-fg); }
.home-stat.st-bins { background: color-mix(in srgb, var(--t-bins-bg) 55%, var(--card-elevated)); border-color: var(--t-bins-bd); }
.home-stat.st-bins .num { color: var(--t-bins-fg); }
.home-stat.st-cal  { background: color-mix(in srgb, var(--t-cal-bg) 55%, var(--card-elevated));  border-color: var(--t-cal-bd); }
.home-stat.st-cal .num  { color: var(--t-cal-fg); }
.home-stat .num {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--ac);
  line-height: 1.1;
}
.home-stat .lbl {
  font-size: 11.5px;
  color: var(--mu);
  font-weight: 600;
  line-height: 1.25;
  margin-top: 4px;
}
.home-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 0 0 18px;
}
@media (min-width: 650px) {
  .home-stats { gap: 12px; }
  .home-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.home-action {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  text-align: left;
  background: var(--card-elevated) !important;
  border: 1px solid var(--bd) !important;
  border-radius: 22px !important;
  padding: 12px 14px !important;
  min-height: 64px;
  box-shadow: var(--shadow-sm);
}
.home-action .ico {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--ac2);
  color: var(--on-ac2);
  flex: none;
}
.home-action.qa-shop { border-color: var(--t-shop-bd) !important; }
.home-action.qa-shop .ico { background: var(--t-shop-bg); color: var(--t-shop-fg); }
.home-action.qa-cal  { border-color: var(--t-cal-bd) !important; }
.home-action.qa-cal .ico  { background: var(--t-cal-bg);  color: var(--t-cal-fg); }
.home-action.qa-bins { border-color: var(--t-bins-bd) !important; }
.home-action.qa-bins .ico { background: var(--t-bins-bg); color: var(--t-bins-fg); }
.home-action.qa-ch   { border-color: var(--t-ch-bd) !important; }
.home-action.qa-ch .ico   { background: var(--t-ch-bg);   color: var(--t-ch-fg); }
.home-action .ico .ms-icon {
  width: 21px;
  height: 21px;
}
.home-action strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--tx);
}
.home-action small {
  display: block;
  color: var(--mu);
  font-size: 11.5px;
  font-weight: 500;
  margin-top: 2px;
}
.upnext-wrap {
  background: var(--surface-low);
  border: 1px solid var(--bd);
  border-radius: 28px;
  padding: 14px;
  margin-bottom: 18px;
}
.upnext-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 6px 12px;
}
.upnext-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ac);
}
.upnext-title .ms-icon {
  width: 18px;
  height: 18px;
}
.upnext-link {
  background: transparent !important;
  color: var(--ac) !important;
  padding: 4px 10px !important;
  min-height: 28px !important;
  font-size: 12.5px !important;
  font-weight: 700 !important;
}
.upnext-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
@media (min-width: 600px) {
  .upnext-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.sched-card {
  background: var(--card-elevated);
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 14px 15px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sched-card.is-today {
  border-color: color-mix(in srgb, var(--ac) 32%, var(--bd));
}
.sched-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.sched-day-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.sched-badge-ico {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--ac2);
  color: var(--on-ac2);
  display: grid;
  place-items: center;
  flex: none;
}
.sched-card:not(.is-today) .sched-badge-ico {
  background: var(--surface-low);
  color: var(--mu);
}
.sched-day-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1.2;
}
.sched-day-sub {
  font-size: 12px;
  font-weight: 600;
  color: var(--mu);
}
.sched-add-btn {
  padding: 5px 11px !important;
  min-height: 30px !important;
  font-size: 12px !important;
  border-radius: 999px !important;
  background: var(--surface-low) !important;
  color: var(--ac) !important;
  border: 1px solid var(--bd) !important;
}
.sched-add-btn .ms-icon {
  width: 15px;
  height: 15px;
}
.sched-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.sched-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 15px;
  background: var(--surface-low);
  border-left: 4px solid var(--item-col, var(--ac));
}
.sched-item-body {
  min-width: 0;
  flex: 1;
}

nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: color-mix(in srgb, var(--surface-low) 92%, transparent);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--bd);
  display: flex;
  justify-content: space-around;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom, 0px));
  gap: 2px;
  z-index: 45;
  box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.05);
}
nav::-webkit-scrollbar {
  display: none;
}
nav button {
  flex: 1 0 auto;
  min-width: 62px;
  border: 0;
  border-radius: 16px;
  background: transparent !important;
  padding: 4px 6px;
  min-height: auto;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--mu);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
nav button b {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 32px;
  border-radius: 999px;
  background: transparent;
  transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1), color 0.15s ease;
}
nav button b .ms-icon {
  width: 22px;
  height: 22px;
}
nav button.on {
  color: var(--tx);
  font-weight: 700;
}
nav button.on b {
  background: var(--ac2);
  color: var(--on-ac2);
}
#gear,
#gx {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 22px);
  right: 22px;
  width: 42px;
  height: 42px;
  min-height: 42px;
  border-radius: 50%;
  padding: 0;
  background: var(--card-elevated);
  color: var(--tx);
  border: 1px solid var(--bd);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}
#gear:hover,
#gx:hover {
  background: var(--ac2);
  color: var(--on-ac2);
}
#gear {
  z-index: 40;
}
#gx {
  z-index: 60;
}
#set {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: var(--bg);
  display: none;
  overflow: auto;
  padding: 18px 16px 48px;
}
#set.on {
  display: block;
  animation: fadeIn 0.2s ease;
}
#set > .set-wrap {
  max-width: 740px;
  margin: 0 auto;
}
#set h1 {
  padding-right: 54px;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(10px);
  background: var(--tx);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  max-width: 88%;
  text-align: center;
  box-shadow: var(--shadow-md);
}
#toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

function ico(name) {
  return `<span class="ms-icon" aria-hidden="true">${ICONS[name] || ICONS.sparkle}</span>`;
}
function catIcon(k) {
  const s = String(k).toLowerCase();
  if (s.includes('fruit')) return ico('fruit');
  if (s.includes('dairy')) return ico('dairy');
  if (s.includes('meat')) return ico('meat');
  if (s.includes('bakery')) return ico('bakery');
  if (s.includes('cupboard')) return ico('cupboard');
  if (s.includes('frozen')) return ico('frozen');
  if (s.includes('drinks')) return ico('drinks');
  if (s.includes('household')) return ico('household');
  return ico('box');
}
function cleanCatLabel(k) {
  return String(k).replace(/^[^\wA-Za-z]+\s*/, '');
}

<script>
const TABS=[['shop',ico('shop'),'Shopping'],['bins',ico('bins'),'Bins'],['info',ico('info'),'Info'],['cal',ico('cal'),'Calendar']];
function whos(e){const P=S.people||[];let a=(e.ps&&e.ps.length?e.ps:e.p?[e.p]:[]).map(id=>P.find(x=>x.id===id)).filter(Boolean);if(!a.length){const n=P.find(x=>(e.t||'').toLowerCase().includes(x.n.toLowerCase()));if(n)a=[n]}return a}
function who(e){return whos(e)[0]}
function ec(e){const a=whos(e);if(!a.length)return COL[e.y]||COL.event;if(a.length===1)return a[0].c;const k=100/a.length;return 'linear-gradient(90deg,'+a.map((p,i)=>p.c+' '+(i*k)+'% '+((i+1)*k)+'%').join(',')+')'}
const COL={event:'#78909c',birthday:'#8e44ad',holiday:'#e08a1e',appointment:'#00a6a6',school:'#795548'};
const DEF=()=>({shop:[],bins:[],info:[],events:[],presets:[],cprods:{},people:[],lists:[],usual:[],meals:{},chores:[],notes:[]});
let S=DEF(),ref=null,cur=new Date(),sel=iso(new Date());cur.setDate(1);
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){return new Date(s+'T12:00:00')}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmt(s){return pd(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
try{const l=JSON.parse(localStorage.getItem('fam')||'null');if(l)S=Object.assign(DEF(),l)}catch(e){}
function save(){try{localStorage.setItem('fam',JSON.stringify(S))}catch(e){}if(ref)ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});render()}

function openInfoModal(id){

 if(infoEditId){
  const item=S.info.find(x=>x.id===infoEditId);
  if(item){
   $('iT').value=item.t||'';
   $('iB').value=item.b||'';
   $('iPin').checked=item.pin!==false;
  }

}

}

/* Multi-list Shopping */
const IL=x=>x.l||'Main';
function shopAdd(t,q,c){const f=S.shop.find(x=>!x.d&&IL(x)===curList&&x.t.toLowerCase()===t.toLowerCase());if(f)f.q=(f.q||1)+q;else S.shop.push({id:uid(),t,c:c||catOf(t),d:0,l:curList,q})}
renderShop=function(){
 $('lists').innerHTML=['Main',...(S.lists||[])].map((n,i)=>chip(n,n===curList,'setList('+i+')')).join('')+chip('+ New list',0,'nlTog()')+(curList!=='Main'?chip('Delete list',0,'delList()'):'');
 $('cats').innerHTML=CK.map((k,i)=>`<button class='chip ${k===shopCat?'on':''}' onclick='setCat(${i})'>${catIcon(k)}${esc(cleanCatLabel(k))}</button>`).join('');
 const mine=S.shop.filter(x=>IL(x)===curList),on=new Set(mine.filter(x=>!x.d).map(x=>x.t.toLowerCase()));
 $('prods').innerHTML=AP(shopCat).map((p,i)=>{const o=on.has(p.toLowerCase()),cu=i>=CATS[shopCat].length;return `<button class='chip ${o?'on':''}' onclick='prod(${i})'>${o?ico('check'):ico('plus')} ${esc(p)}${cu?` <span class='chip-del' onclick='event.stopPropagation();delProd(${i-CATS[shopCat].length})'>${ico('close')}</span>`:''}</button>`}).join('')+`<button class='chip' onclick='addProd()'>${ico('plus')} New item</button>`;
 $('shopL').innerHTML=[...CK,OT].map(k=>{const it=mine.filter(x=>(x.c||catOf(x.t))===k).sort((a,b)=>a.d-b.d);return it.length?`<h2>${catIcon(k)}${esc(cleanCatLabel(k))}</h2>`+it.map(i=>`<div class='card row'><input type='checkbox' ${i.d?'checked':''} onchange='tick("${i.id}")'><span class='grow ${i.d?'done':''}'>${esc(i.t)}${i.q>1?' <b>× '+i.q+'</b>':''}</span><button class='x' aria-label='Increase' onclick='qty("${i.id}",1)'>${ico('plus')}</button><button class='x' aria-label='Decrease' onclick='qty("${i.id}",-1)'>${ico('minus')}</button><button class='x' aria-label='Remove' onclick='del("shop","${i.id}")'>${ico('close')}</button></div>`).join(''):''}).join('')||'<p class="mu">Nothing on this list yet.</p>'};
prod=function(i){const p=AP(shopCat)[i],f=S.shop.find(x=>!x.d&&IL(x)===curList&&x.t.toLowerCase()===p.toLowerCase());if(f)S.shop=S.shop.filter(y=>y!==f);else S.shop.push({id:uid(),t:p,c:shopCat,d:0,l:curList,q:1});save()};
saveProd=function(){const v=$('npI').value.trim();if(!v)return;$('npI').value='';if(!AP(shopCat).some(p=>p.toLowerCase()===v.toLowerCase())){S.cprods=Object.assign({},S.cprods);S.cprods[shopCat]=[...(S.cprods[shopCat]||[]),v]}shopAdd(v,1,shopCat);save()};
addShop=function(){const v=val('shopIn'),q=Math.max(1,parseInt($('shopQ').value)||1);if(!v)return;$('shopIn').value='';$('shopQ').value=1;shopAdd(v,q);save()};
clearShop=function(){S.shop=S.shop.filter(x=>!(x.d&&IL(x)===curList));save()};
window.qty=(id,n)=>{const i=S.shop.find(x=>x.id===id);i.q=Math.max(1,(i.q||1)+n);save()};
window.setList=i=>{curList=['Main',...(S.lists||[])][i]||'Main';render()};
window.nlTog=()=>{const r=$('nlRow');r.style.display=r.style.display==='none'?'flex':'none';$('nlI').value='';if(r.style.display!=='none')$('nlI').focus()};
window.nlSave=()=>{const v=$('nlI').value.trim();if(!v||v==='Main'||(S.lists||[]).includes(v))return;S.lists=[...(S.lists||[]),v];curList=v;$('nlRow').style.display='none';save()};
window.delList=()=>{if(armL!==curList){armL=curList;toast('Tap Delete list again to remove “'+curList+'” and its items');setTimeout(()=>{armL=null},4000);return}S.shop=S.shop.filter(x=>IL(x)!==curList);S.lists=(S.lists||[]).filter(x=>x!==curList);curList='Main';armL=null;save()};
window.usualAdd=()=>{const u=S.usual||[];if(!u.length)return toast('No usual shop saved yet');u.forEach(n=>shopAdd(n,1));save();toast('Usual shop added')};
window.usualSave=()=>{S.usual=S.shop.filter(x=>!x.d&&IL(x)===curList).map(x=>x.t);save();toast('Saved '+S.usual.length+' items as your usual shop')};

/* Meals */
window.mvW=n=>{mw=addD(mw,7*n);render()};
window.mlSet=(d,k,v)=>{S.meals=S.meals||{};(S.meals[d]=S.meals[d]||{})[k]=v;save()};
window.mlAdd=d=>{const l=((S.meals||{})[d]||{}).i||'',a=l.split(',').map(s=>s.trim()).filter(Boolean);if(!a.length)return toast('Add some ingredients first');a.forEach(x=>shopAdd(x,1));save();toast(a.length+' added to '+curList)};
function rMeals(){let h=`<div class='row' style='margin-bottom:12px'><button onclick='mvW(-1)' aria-label='Previous week'>${ico('chevL')}</button><div class='grow' style='text-align:center;font-weight:700;font-size:16px'>${fmt(mw)} – ${fmt(addD(mw,6))}</div><button onclick='mvW(1)' aria-label='Next week'>${ico('chevR')}</button></div>`;
 for(let i=0;i<7;i++){const d=addD(mw,i),m=(S.meals||{})[d]||{};h+=`<div class='card'><b>${fmt(d)}</b><div class='form' style='margin:8px 0 0;padding:0;background:none;border:0'><input type='text' placeholder='Dinner' value="${ea(m.t||'')}" onchange='mlSet("${d}","t",this.value)'><input type='text' placeholder='Ingredients, comma separated' value="${ea(m.i||'')}" onchange='mlSet("${d}","i",this.value)'><button onclick='mlAdd("${d}")'>${ico('plus')} Shopping list</button></div></div>`}

const chD=c=>c.last&&(c.r==='d'?c.last===T():c.r==='w'?c.last>=wk(T()):true);
window.chTick=id=>{const c=A('chores').find(x=>x.id===id);c.last=chD(c)?'':T();save()};

}

/* Render Hook */
const _r=render;
render=function(){_r();if(!S.pSeeded&&!(S.people||[]).length){S.people=[{id:'p1',n:'Stephen',c:'#2f7de1'},{id:'p2',n:'Amy',c:'#e0447c'},{id:'p3',n:'Otis',c:'#3a9a4a'}];S.pSeeded=1;persist()}
 const po=(S.people||[]).map(p=>`<option value='${p.id}'>${esc(p.n)}</option>`).join('');
 [['chP','Anyone']].forEach(([id,l])=>{const v=$(id).value;$(id).innerHTML=`<option value=''>${l}</option>`+po;$(id).value=v});
 rW();
 const isMonth=cv==='m';
 $('grid').style.display=isMonth?'':'none';
 if($('calMonthNav'))$('calMonthNav').style.display=isMonth?'flex':'none';
 $('agL').innerHTML=cv==='w'?ag(wk(sel),7):cv==='a'?ag(T(),30):'';
 $('calBar').className='cal-toolbar';
 $('calBar').innerHTML=`<div class="seg-group">`+[['m','Month'],['w','Week'],['a','Agenda']].map(([k,l])=>`<button type="button" class="seg-btn ${cv===k?'on':''}" onclick="setCv('${k}')">${l}</button>`).join('')+`</div><select class="cal-filter-sel" aria-label="Filter by family member" onchange="setFp(this.value)"><option value="">👨‍👩‍👧 Everyone</option>`+(S.people||[]).map(p=>`<option value="${p.id}" ${fp===p.id?'selected':''}>${esc(p.n)}</option>`).join('')+`</select>`;
 rToday();rMeals();rChores()};
TABS.splice(0,TABS.length,['today',ico('home'),'Home'],['cal',ico('cal'),'Calendar'],['shop',ico('shop'),'Shopping'],['meals',ico('meals'),'Meals'],['chores',ico('chores'),'Chores'],['bins',ico('bins'),'Bins'],['info',ico('info'),'Info']);
if($('s-fam'))TABS.push(['fam',ico('home'),'Family']);
$('nav').innerHTML=TABS.map(t=>`<button data-k="${t[0]}" onclick="tab('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
tab('today');render();

<!-- Settings Sheet, Appearance Switcher & JSON Backup/Restore -->
<script>
(function(){
document.body.insertAdjacentHTML('beforeend',`
<button id='gear' aria-label='Settings' onclick='setOpen(true)'>
  <svg viewBox='0 0 24 24' width='21' height='21' fill='currentColor' aria-hidden='true'><path d='M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z'/></svg>
</button>
<div id='set'>
  <div class='set-wrap'>
    
    <h1>Settings</h1>
    <div class='panel'>
      <h2>Theme and colour palette</h2>
      <div class='card'>
        <div style="font-weight:700;margin-bottom:8px">Choose a colour</div>
        <div class='chips' style='flex-wrap:wrap;gap:8px' id='paletteChips'>
          <button class='chip on' data-pal='pixel' onclick='setThemePalette("pixel",this)'>Classic Indigo</button>
          <button class='chip' data-pal='amazon' onclick='setThemePalette("amazon",this)'>Sunset Orange</button>
          <button class='chip' data-pal='ebay' onclick='setThemePalette("ebay",this)'>Fire Red</button>
          <button class='chip' data-pal='googletv' onclick='setThemePalette("googletv",this)'>Ocean Blue</button>
          <button class='chip' data-pal='aliexpress' onclick='setThemePalette("aliexpress",this)'>Coral Red</button>
          <button class='chip' data-pal='googlehealth' onclick='setThemePalette("googlehealth",this)'>Lagoon Teal</button>
          <button class='chip' data-pal='disney' onclick='setThemePalette("disney",this)'>Midnight Navy</button>
        </div>
      </div>
    </div>
    <div class='panel'>
      <h2 style='margin-top:4px'>Countdowns</h2>
      <div class='card' id='cdSettings'></div>
    </div>
    <div class='panel'>
      <h2 style='margin-top:4px'>Backup &amp; restore</h2>
      <div class='card'>
        <div class='mu' style='margin-bottom:10px'>Save a copy of everything. You will be asked where to save it, such as Google Drive or Files.</div>
        <div class='row' style='flex-wrap:wrap'>
          <button class='p' onclick='bkExport()'>Export backup</button>
          <button onclick='document.getElementById("bkF").click()'>Restore from file</button>
          <button onclick='bkTa()'>Paste text</button>
        </div>
        <input id='bkF' type='file' accept='.json,application/json' style='display:none' onchange='bkLoad(this)'>
        <textarea id='bkT' style='display:none;margin-top:10px;min-height:110px'></textarea>
        <div id='bkPg' style='display:none;margin-top:8px'><button onclick='bkPasteGo()'>Check pasted text</button></div>
        <div id='bkM' class='mu' style='margin-top:8px'></div>
        <div id='bkAct' class='row' style='display:none;margin-top:8px'>
          <button class='p' onclick='bkApply()'>Restore now</button>
          <button onclick='bkCancel()'>Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>`);
window.setOpen=v=>{$('set').classList.toggle('on',v);if(v)$('set').scrollTop=0};
let dl=null,pend=null;
try{claude.use('downloads').then(x=>{dl=x}).catch(()=>{})}catch(e){}
window.bkExport=async()=>{
 const t=JSON.stringify({app:'family-hub',v:1,saved:new Date().toISOString(),data:JSON.parse(JSON.stringify(S))},null,2);
 const filename='family-hub-backup-'+iso(new Date())+'.json',msg=x=>{$('bkM').textContent=x};
 msg('Choose where to save your backup…');
 /* 1. Save window where you pick the folder (desktop Chrome and Edge) */
 if(window.showSaveFilePicker){
  try{const h=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Family Hub backup',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(t);await w.close();msg('Backup saved.');return}
  catch(e){if(e&&e.name==='AbortError'){msg('Save cancelled.');return}}
 }
 /* 2. Share sheet (phones): pick Google Drive, Files, Gmail or any app */
 try{
  const file=new File([t],filename,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Family Hub backup'});msg('Backup sent. Check the place you chose.');return}
 }catch(e){if(e&&e.name==='AbortError'){msg('Save cancelled.');return}}
 /* 3. Claude download box, then a normal download, then copy and paste */
 if(dl&&typeof dl.save==='function'){
  try{await dl.save({filename,data:t});msg('Backup exported successfully.');return}
  catch(e){if(e&&e.code==='declined'){msg('Save cancelled.');return}}
 }
 try{
  const blob=new Blob([t],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  $('bkT').style.display='none';msg('Backup downloaded. Check your Downloads or Files folder.');return;
 }catch(e){}
 $('bkT').style.display='';$('bkT').value=t;$('bkT').focus();$('bkT').select();
 let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);copied=true}}catch(e){}
 msg(copied?'Files cannot be saved here, but your backup has been copied. Paste it into a note or document.':'Files cannot be saved here. Your backup is shown in the box; select and copy it into a note or document.');
};
function validateBackupData(d){
 if(!d||typeof d!=='object'||Array.isArray(d))return false;
 const arrays=['shop','bins','info','events','presets','people','lists','usual','chores','notes'];
 for(const k of arrays)if(d[k]!==undefined&&!Array.isArray(d[k]))return false;
 for(const k of ['cprods','meals'])if(d[k]!==undefined&&(!d[k]||typeof d[k]!=='object'||Array.isArray(d[k])))return false;
 return Array.isArray(d.shop)||Array.isArray(d.events);
}
function offer(txt){try{const j=JSON.parse(txt),d=j&&j.data!==undefined?j.data:j;if(!validateBackupData(d))throw 0;pend=d;
 $('bkM').textContent='Found a backup'+(j&&j.saved?' from '+new Date(j.saved).toLocaleDateString():'')+': '+(d.shop||[]).length+' shopping items and '+(d.events||[]).length+' events.';$('bkAct').style.display='flex'}
 catch(e){pend=null;$('bkAct').style.display='none';$('bkM').textContent='That doesn’t look like a Family Hub backup.'}}
window.bkLoad=i=>{const f=i.files[0];i.value='';if(!f)return;const r=new FileReader();r.onload=()=>offer(r.result);r.readAsText(f)};
window.bkTa=()=>{$('bkT').style.display='';$('bkT').value='';$('bkPg').style.display=''};
window.bkPasteGo=()=>offer($('bkT').value);
window.bkApply=()=>{if(!validateBackupData(pend)){pend=null;$('bkAct').style.display='none';$('bkM').textContent='That backup is incomplete or invalid.';return}
 const next={...DEF()};for(const k of Object.keys(pend)){if(k!=='__proto__'&&k!=='constructor'&&k!=='prototype')next[k]=pend[k]}
 S=next;pend=null;$('bkAct').style.display='none';$('bkT').style.display='none';$('bkPg').style.display='none';save();$('bkM').textContent='Backup restored.';toast('Backup restored')};
window.bkCancel=()=>{pend=null;$('bkAct').style.display='none';$('bkM').textContent=''};
})();
</script>
<!-- Pixel OS At-a-Glance Dashboard & Theme Controller -->
<script id="family-hub-refresh-script">
(function(){
 const root=document.documentElement;
 root.dataset.ui='refresh';
 const savedLook='pixel';
 const savedTheme=localStorage.getItem('fam-theme-mode')||'auto';
 root.dataset.look=savedLook;
 if(savedTheme==='light'||savedTheme==='dark')root.dataset.theme=savedTheme;

 window.setLook=function(v){
  if(!['warm','pixel','minimal'].includes(v))return;
  root.dataset.look=v;
  localStorage.setItem('fam-look-v2',v);
  document.querySelectorAll('[data-look-choice]').forEach(b=>b.classList.toggle('on',b.dataset.lookChoice===v));

    if (!ttSpot) return;

    /* Put Today and tomorrow above Countdowns in DOM as well as CSS order */
    if (cdSpot && ttSpot.compareDocumentPosition(cdSpot) & Node.DOCUMENT_POSITION_PRECEDING) {
      cdSpot.before(ttSpot);
    }

    const t = T(), t1 = addD(t, 1);
    const collectDay = (d, dayBadge) => {
      const it = [];
      hol(d).forEach(n => it.push({ col: '#e0a100', t: n, badge: dayBadge }));

      return it;
    };

    const todayItems = collectDay(t, 'Today');
    const tomorrowItems = collectDay(t1, 'Tomorrow');
    const combined = [...todayItems, ...tomorrowItems];

    let rowsHtml = '';
    if (combined.length) {
      rowsHtml = combined.slice(0, 5).map(x => `
        <div class="cd-line">
          <span class="cd-dot" style="background:${x.col}"></span>

        rowsHtml += `<div class="un-empty">+${combined.length - 5} more</div>`;

    } else {
      rowsHtml = `
        <div class="cd-line">
          <span class="cd-dot" style="background:rgba(255,255,255,0.45)"></span>
          <span class="cd-name" style="opacity:0.88">Nothing planned</span>

  const prevRender = window.render;

    });

 return out.sort((a,b)=>a.days-b.days).slice(0,c.max)}

<script id="polish31-script">
(function(){
  /* 1. Inject Create Note button & Modal Popup into #s-notes (arranged like Important Info) */
  const notesSec = $('s-notes');
  const noteL = $('noteL');
  if (notesSec && noteL && !$('noteModal')) {
    noteL.insertAdjacentHTML('afterend', `
      <div class="center-actions">
        <button class="btn-add-main" onclick="openNoteModal()">Create note</button>
      </div>
      <div class="modal-backdrop" id="noteModal" onclick="if(event.target===this)closeNoteModal()">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
          <div class="modal-head">
            <h3 id="noteModalTitle"><span class="hdr-icon" style="width:32px;height:32px;background:var(--t-info-bg);color:var(--t-info-fg)">${ico('notes')}</span> <span id="noteModalH">Create note</span></h3>
            <button class="x" aria-label="Close" onclick="closeNoteModal()">${ico('close')}</button>
          </div>
          <div class="modal-grid">
            <div class="modal-field full">
              <span>From</span>
              <div id="noteModalWho" class="chips who-chips" style="padding:2px 0"></div>
            </div>
            <label class="modal-field full">
              <span>Note</span>
              <textarea id="noteModalT" maxlength="500" placeholder="Write a note for the family…"></textarea>
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" onclick="closeNoteModal()">Cancel</button>
            <button type="button" class="p" id="noteSaveBtn" onclick="saveNoteModal()">Post note</button>
          </div>
        </div>
      </div>
    `);
  }

  let noteEditId = null;
  let noteAuthorId = '';
  let openReplyBoxes = {};
  let replyAuthorByNote = {};

  function renderNoteModalWho() {
    const el = $('noteModalWho');
    if (!el) return;
    const P = S.people || [];
    if (!noteAuthorId && meP()) noteAuthorId = meP().id;
    el.innerHTML = P.map(p => `<button type="button" class="chip ${p.id === noteAuthorId ? 'on' : ''}" onclick="setNoteAuthor('${p.id}')">${av(p, 20)} ${esc(p.n)}</button>`).join('');
  }

  window.setNoteAuthor = function(id) {
    noteAuthorId = id;
    renderNoteModalWho();
  };

  window.openNoteModal = function(id) {
    noteEditId = id || null;
    const defP = meP();
    if (noteEditId) {
      const n = A('notes').find(x => x.id === noteEditId);
      if (n) {
        noteAuthorId = n.p || (defP ? defP.id : '');
        if ($('noteModalT')) $('noteModalT').value = n.t || '';
      }
      if ($('noteModalH')) $('noteModalH').textContent = 'Edit note';
      if ($('noteSaveBtn')) $('noteSaveBtn').textContent = 'Save changes';
    } else {
      noteAuthorId = defP ? defP.id : '';
      if ($('noteModalT')) $('noteModalT').value = '';
      if ($('noteModalH')) $('noteModalH').textContent = 'Create note';
      if ($('noteSaveBtn')) $('noteSaveBtn').textContent = 'Post note';
    }
    renderNoteModalWho();
    if ($('noteModal')) $('noteModal').classList.add('on');
    setTimeout(() => { if ($('noteModalT')) $('noteModalT').focus(); }, 60);
  };

  window.closeNoteModal = function() {
    noteEditId = null;
    if ($('noteModal')) $('noteModal').classList.remove('on');
  };

  window.saveNoteModal = function() {
    const t = ($('noteModalT') ? $('noteModalT').value : '').trim();
    if (!t) return toast('Write something first');
    const m = meP();
    const author = noteAuthorId || (m ? m.id : '');
    if (noteEditId) {
      const n = A('notes').find(x => x.id === noteEditId);
      if (n) {
        n.t = t;
        n.p = author;
      }
      closeNoteModal();
      save();
      toast('Note updated');
    } else {
      A('notes').push({ id: uid(), p: author, t, ts: new Date().toISOString(), pin: 0, replies: [] });
      closeNoteModal();
      save();
      toast('Note posted');
    }
  };

  window.togReplyBox = function(noteId) {
    openReplyBoxes[noteId] = !openReplyBoxes[noteId];
    if (openReplyBoxes[noteId] && !replyAuthorByNote[noteId]) {
      const m = meP();
      replyAuthorByNote[noteId] = m ? m.id : ((S.people && S.people[0]) ? S.people[0].id : '');
    }
    rNotes();
    if (openReplyBoxes[noteId]) {
      setTimeout(() => {
        const inp = $('rIn_' + noteId);
        if (inp) inp.focus();
      }, 50);
    }
  };

  window.setReplyAuthor = function(noteId, pid) {
    const inp = $('rIn_' + noteId);
    const curVal = inp ? inp.value : '';
    replyAuthorByNote[noteId] = pid;
    rNotes();
    const inpAfter = $('rIn_' + noteId);
    if (inpAfter) {
      inpAfter.value = curVal;
      inpAfter.focus();
    }
  };

  window.addNoteReply = function(noteId) {
    const inp = $('rIn_' + noteId);
    const t = (inp ? inp.value : '').trim();
    if (!t) return toast('Write a reply first');
    const n = A('notes').find(x => x.id === noteId);
    if (!n) return;
    n.replies = Array.isArray(n.replies) ? n.replies : [];
    const m = meP();
    const pId = replyAuthorByNote[noteId] || (m ? m.id : '');
    n.replies.push({ id: uid(), p: pId, t, ts: new Date().toISOString() });
    openReplyBoxes[noteId] = false;
    save();
    toast('Reply added');
  };

  window.delNoteReply = function(noteId, replyId) {
    const n = A('notes').find(x => x.id === noteId);
    if (!n || !Array.isArray(n.replies)) return;
    n.replies = n.replies.filter(r => r.id !== replyId);
    save();
  };

  /* Override rNotes to display notes at the top like Important Info, with Replies and Reply composer */
  window.rNotes = function() {
    const L = [...A('notes')].sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (a.ts < b.ts ? 1 : -1));
    const P = S.people || [];
    const defP = meP();

    if (!L.length) {
      $('noteL').innerHTML = `<div class="bins-empty" style="text-align:center;padding:32px 20px;border-radius:26px;background:var(--card-elevated);border:1px dashed var(--bd-strong);color:var(--mu);margin-bottom:16px"><div class="empty-bin" style="width:52px;height:52px;border-radius:18px;background:var(--t-info-bg);color:var(--t-info-fg);display:grid;place-items:center;margin:0 auto 12px">${ico('notes')}</div><b style="display:block;color:var(--tx);font-size:15px">No notes yet</b><p style="font-size:12.5px;max-width:260px;margin:6px auto 0">Tap Create note below to leave a message for the family.</p></div>`;
      return;
    }

    $('noteL').innerHTML = L.map(n => {
      const p = PP(n.p);
      const replies = Array.isArray(n.replies) ? n.replies : [];
      const isRepOpen = !!openReplyBoxes[n.id];
      const repAuthor = replyAuthorByNote[n.id] || (defP ? defP.id : (P[0] ? P[0].id : ''));

      const repliesHtml = replies.length ? `<div class="note-replies">${replies.map(r => {
        const rp = PP(r.p);
        return `<div class="note-reply-item">
          ${av(rp, 28)}
          <div class="grow">
            <div class="note-reply-meta"><b>${esc(rp ? rp.n : 'Family')}</b><span>${esc(fmtTs(r.ts))}</span></div>
            <div class="note-reply-text">${esc(r.t)}</div>
          </div>
          <button class="x" onclick="delNoteReply('${n.id}','${r.id}')" aria-label="Delete reply">${ico('close')}</button>
        </div>`;
      }).join('')}</div>` : '';

      const replyComposer = `<div class="note-reply-bar">
        <button type="button" class="note-reply-toggle" onclick="togReplyBox('${n.id}')">${isRepOpen ? 'Cancel reply' : (replies.length ? `Reply (${replies.length})` : 'Reply')}</button>
      </div>
      <div class="note-reply-box ${isRepOpen ? 'on' : ''}">
        <div class="note-reply-who">
          <span>Replying as:</span>
          ${P.map(q => `<button type="button" class="chip ${q.id === repAuthor ? 'on' : ''}" onclick="setReplyAuthor('${n.id}','${q.id}')">${av(q, 18)} ${esc(q.n)}</button>`).join('')}
        </div>
        <div class="note-reply-input-row">
          <input id="rIn_${n.id}" type="text" placeholder="Write a reply…" onkeydown="if(event.key==='Enter'){addNoteReply('${n.id}');event.preventDefault()}">
          <button type="button" onclick="addNoteReply('${n.id}')">Reply</button>
        </div>
      </div>`;

      return `<div class="card info-card note-card ${n.pin ? 'pinned' : ''}">
        <div class="row" style="align-items:flex-start">
          ${av(p, 38)}
          <div class="grow">
            <div class="note-meta"><b>${esc(p ? p.n : 'Family')}</b><span>${esc(fmtTs(n.ts))}</span></div>
            <div class="note-text">${esc(n.t)}</div>
          </div>
          <button class="x" title="Edit" onclick="openNoteModal('${n.id}')">${ico('edit')}</button>
          <button class="x" title="Delete" onclick="del('notes','${n.id}')">${ico('close')}</button>

        ${repliesHtml}
        ${replyComposer}
      </div>`;
    }).join('');
  };

  /* 2. Add "Reset and wipe data" panel to Settings so the user can wipe all info for a clean Netlify upload */
  const setWrap = document.querySelector('#set .set-wrap');
  if (setWrap && !$('wipePanel')) {
    const wipePanel = document.createElement('div');
    wipePanel.className = 'panel';
    wipePanel.id = 'wipePanel';
    wipePanel.innerHTML = `
      <h2>Reset and wipe data</h2>
      <div class="card">
        <div style="font-weight:700;margin-bottom:4px">Wipe all information</div>
        <div class="mu" style="margin-bottom:12px">Clear all shopping items, calendar events, bins, meals, chores, notes, and important info so you have a completely clean version ready for Netlify.</div>
        <div class="row" style="flex-wrap:wrap;gap:10px" id="wipeInitRow">

            <button type="button" onclick="cancelWipeAll()">Cancel</button>

        </div>
      </div>

  window.askWipeAll = function() {
    if ($('wipeConfirmRow')) $('wipeConfirmRow').style.display = 'block';

    if ($('wipeConfirmRow')) $('wipeConfirmRow').style.display = 'none';
  };
  window.confirmWipeAll = function() {
    /* Reset state to clean defaults (keeps default family members Stephen, Amy, Otis with no DOBs/photos, or re-seeds cleanly) */
    S = DEF();
    S.people = [
      { id: 'p1', n: 'Stephen', c: '#2f7de1' },
      { id: 'p2', n: 'Amy', c: '#e0447c' },
      { id: 'p3', n: 'Otis', c: '#3a9a4a' }

    S.pSeeded = 1;
    try {
      localStorage.removeItem('fam');
      localStorage.removeItem('fam-shop-col');
      localStorage.removeItem('fam-me');
      localStorage.setItem('fam', JSON.stringify(S));

 function clean(){document.querySelectorAll('#s-shop .aisle-bar').forEach(e=>{if(e.id!=='aisleBar')e.remove()});document.querySelectorAll('#aisleBtn').forEach((b,i,all)=>{if(i>0){const bar=b.closest('.aisle-bar');if(bar&&bar.id!=='aisleBar')bar.remove()}})}
 clean();setTimeout(clean,600);setTimeout(clean,1500);
 const _tab=window.tab;window.tab=function(k){if(typeof _tab==='function')_tab.apply(this,arguments);if(k==='shop')setTimeout(clean,30)};
})();
</script>
<script id="reset-password">
window.fhReset=async function(){
 const e=((document.getElementById('seE')||{}).value||'').trim();
 if(!e){toast('Type your email address first, then tap Forgot password');return}
 try{
  await fbLoad();
  await fbA.sendPasswordResetEmail(fbAuth,e);
  toast('Reset email sent. Check your inbox and spam folder.');
 }catch(x){
  const m=(x&&x.code)==='auth/invalid-email'?'That email address does not look right.':'Could not send the reset email. Check the address and try again.';
  toast(m);
 }
};
</script>
<script id="auto-update">
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
 let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
  const check=()=>reg.update().catch(()=>{});
  check();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  setInterval(check,60*60*1000);
 }).catch(()=>{});
}
</script>
<script id="v37-features">
/* v37: undo for deletes, chore archive, last-shop list, calendar export, new-notes badge */
(function(){
 const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
 const persistAll=()=>{try{localStorage.setItem('fam',JSON.stringify(S))}catch(e){} if(typeof persist==='function')try{persist()}catch(e){}};
 const rerender=()=>{if(typeof render==='function')render()};
 const pname=id=>{const p=(S.people||[]).find(x=>x.id===id);return p?p.n:''};
 S.choreArchive=S.choreArchive||[]; S.lastShop=S.lastShop||[];

 /* 1. Undo for deletes */
 const origDel=window.del;
 window.del=function(k,id){
  const item=(S[k]||[]).find(x=>x.id===id);
  origDel.apply(this,arguments);
  if(item){const label=item.t||item.n||item.title||'Item';
   if(typeof showUndo==='function')showUndo('Removed “'+label+'”',()=>{S[k].push(item);persistAll();rerender()});
  }
 };

 /* 2. Chore archive: a completed one-off chore moves out of the list */
 const origTick=window.chTick;
 window.chTick=function(id){
  origTick.apply(this,arguments);
  const c=(S.chores||[]).find(x=>x.id===id);
  if(c&&c.r==='n'&&c.last){
   S.chores=S.chores.filter(x=>x.id!==id);
   S.choreArchive.unshift(Object.assign({},c,{doneAt:todayIso(),doneBy:(c.ps||[]).map(pname).filter(Boolean).join(' and ')||'Anyone'}));
   persistAll();rerender();
  }
 };
 function choreArchivePanel(){
  const view=document.getElementById('s-chores');if(!view)return;const old=view.querySelector('#choreArchive');if(old)old.remove();
  const items=S.choreArchive;
  const box=document.createElement('div');box.id='choreArchive';box.style.marginTop='22px';
  box.innerHTML='<h2>Completed to-dos ('+items.length+')</h2>'+(items.length?items.map(c=>`<div class="card" style="display:flex;gap:10px;align-items:center"><div class="grow"><b>${esc(c.t)}</b><div class="mu">${esc(c.doneBy)} · ${esc(c.doneAt)}</div></div><button class="chip" data-arch-restore="${c.id}">Restore</button><button class="chip" data-arch-del="${c.id}" aria-label="Delete">✕</button></div>`).join(''):'<div class="mu">Nothing archived yet.</div>');
  view.appendChild(box);
 }
 document.addEventListener('click',e=>{
  const r=e.target.closest('[data-arch-restore]');
  if(r){const c=S.choreArchive.find(x=>x.id===r.dataset.archRestore);if(c){S.choreArchive=S.choreArchive.filter(x=>x.id!==c.id);const {doneAt,doneBy,...back}=c;back.last='';S.chores.push(back);persistAll();rerender();toast&&toast('Chore restored')}return}
  const d=e.target.closest('[data-arch-del]');
  if(d){S.choreArchive=S.choreArchive.filter(x=>x.id!==d.dataset.archDel);persistAll();rerender();return}
  const f=e.target.closest('[data-finish-shop]');
  if(f){const ticked=(S.shop||[]).filter(x=>x.d);if(!ticked.length){toast&&toast('Tick off some items first');return}
   S.lastShop=[{date:todayIso(),items:ticked.map(x=>({t:x.t,q:x.q||1,c:x.c}))}].concat(S.lastShop).slice(0,10);
   S.shop=(S.shop||[]).filter(x=>!x.d);persistAll();rerender();toast&&toast('Shop finished. Last shop saved.');return}
  const a=e.target.closest('[data-lastshop-add]');
  if(a){const g=S.lastShop[+a.dataset.lastshopAdd];if(g){g.items.forEach(x=>{if(!S.shop.some(y=>!y.d&&y.t.toLowerCase()===x.t.toLowerCase()))S.shop.push({id:Math.random().toString(36).slice(2,9),t:x.t,c:x.c||'other',d:0,l:'Main',q:x.q||1})});persistAll();rerender();toast&&toast('Added back to your list')}return}
  if(e.target.closest('[data-export-ics]')){exportIcs();return}
 });

 /* 3. Last shop + finish shop on the shopping page */
 function shopExtras(){
  const view=document.getElementById('s-shop');if(!view)return;const oldBox=view.querySelector('#lastShopBox');if(oldBox)oldBox.remove();
  const box=document.createElement('div');box.id='lastShopBox';box.style.marginTop='22px';
  const done=(S.shop||[]).filter(x=>x.d).length;
  box.innerHTML='<div class="bar" style="margin-bottom:10px"><button class="chip on" data-finish-shop="1">Finish shop'+(done?' ('+done+')':'')+'</button></div>'+
   '<h2>Last shops</h2>'+(S.lastShop.length?S.lastShop.map((g,i)=>`<div class="card"><div class="row"><b class="grow">${esc(g.date)}</b><button class="chip" data-lastshop-add="${i}">Add all back</button></div><div class="mu" style="margin-top:6px">${g.items.map(x=>esc(x.t)+(x.q>1?' × '+x.q:'')).join(', ')}</div></div>`).join(''):'<div class="mu">No finished shops yet.</div>');
  view.appendChild(box);
 }

 /* 4. Calendar export (.ics) */
 function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
 function icsDate(s){return s.replace(/-/g,'')}
 function icsNext(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+1);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
 function exportIcs(){
  const map={d:'FREQ=DAILY',w:'FREQ=WEEKLY',f:'FREQ=WEEKLY;INTERVAL=2',m:'FREQ=MONTHLY',y:'FREQ=YEARLY'};
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Hub//EN','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  (S.events||[]).forEach(e=>{
   lines.push('BEGIN:VEVENT','UID:'+e.id+'@family-hub','DTSTAMP:'+stamp,'SUMMARY:'+icsEsc(e.t));
   const end=e.e&&e.e>=e.d?e.e:e.d;
   if(e.a||!e.m){lines.push('DTSTART;VALUE=DATE:'+icsDate(e.d),'DTEND;VALUE=DATE:'+icsNext(end))}
   else{const t=s=>s.replace(':','')+'00';lines.push('DTSTART:'+icsDate(e.d)+'T'+t(e.m),'DTEND:'+icsDate(end)+'T'+t(e.m2||e.m))}
   if(e.r&&e.r!=='n'&&map[e.r]){let rr=map[e.r];if(e.u)rr+=';UNTIL='+icsDate(e.u)+(e.a||!e.m?'':'T235959');lines.push('RRULE:'+rr)}
   if(e.n)lines.push('DESCRIPTION:'+icsEsc(e.n));
   lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='family-hub-calendar.ics';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast&&toast('Calendar file ready. Open it to add to your calendar app.');
 }
 function calExport(){
  const view=document.getElementById('s-cal');if(!view||view.querySelector('#calExportBtn'))return;
  const b=document.createElement('div');b.id='calExportBtn';b.className='center-actions';
  b.innerHTML='<button class="chip" data-export-ics="1">Export calendar (.ics)</button>';
  view.appendChild(b);
 }

 /* 5. New-notes badge on the Notes tab */
 function notesBadge(){
  const btn=[...document.querySelectorAll('nav button')].find(b=>/notes/i.test(b.textContent));
  if(!btn)return;
  const seen=localStorage.getItem('fh_notes_seen')||'';
  const n=(S.notes||[]).filter(x=>(x.ts||'')>seen).length;
  let badge=btn.querySelector('.note-badge');
  if(!badge){badge=document.createElement('span');badge.className='note-badge';badge.style.cssText='position:absolute;transform:translate(22px,-14px);background:#d93025;color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;padding:0 5px;display:none;align-items:center;justify-content:center';btn.style.position='relative';btn.appendChild(badge)}
  badge.textContent=n>9?'9+':String(n);badge.style.display=n?'inline-flex':'none';
 }
 function markNotesSeen(){localStorage.setItem('fh_notes_seen',new Date().toISOString());notesBadge()}


 /* keep the panels in place after every redraw */
 const origRender=window.render;
 window.render=function(){const r=origRender.apply(this,arguments);
  const on=(document.querySelector('.sec.on')||{}).id;
  if(on==='s-chores')choreArchivePanel();
  if(on==='s-shop')shopExtras();
  if(on==='s-cal')calExport();
  notesBadge();return r};
 /* hooks */
 const origTab=window.tab;
 window.tab=function(k){
  origTab.apply(this,arguments);
  if(k==='chores')setTimeout(choreArchivePanel,0);
  if(k==='shop')setTimeout(shopExtras,0);
  if(k==='cal')setTimeout(calExport,0);
  if(k==='notes')setTimeout(markNotesSeen,0);
  setTimeout(notesBadge,0);
 };
 setInterval(notesBadge,30000);
 setTimeout(notesBadge,800);
})();
</script>

<script id="v38-notes-archive">
/* v38: archive for notes */
(function(){
 const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const persistAll=()=>{try{localStorage.setItem('fam',JSON.stringify(S))}catch(e){} if(typeof persist==='function')try{persist()}catch(e){}};
 S.notesArchive=S.notesArchive||[];
 const fmt=s=>{try{return new Date(s).toLocaleDateString(undefined,{day:'numeric',month:'short'})}catch(e){return ''}};
 function decorateNoteButtons(){
  document.querySelectorAll('#s-notes .note-card').forEach(card=>{
   if(card.querySelector('[data-note-archive]'))return;
   const del=card.querySelector('button[title="Delete"]');
   const m=del&&del.getAttribute('onclick')&&del.getAttribute('onclick').match(/del\('notes','([^']+)'\)/);
   if(!m)return;
   const btn=document.createElement('button');btn.className='x';btn.title='Archive';btn.setAttribute('aria-label','Archive note');btn.dataset.noteArchive=m[1];
   btn.innerHTML='<span class="ms-icon" aria-hidden="true" style="width:18px;height:18px"><svg viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/></svg></span>';
   del.parentNode.insertBefore(btn,del);
  });
 }
 function archivePanel(){
  const view=document.getElementById('s-notes');if(!view)return;
  const old=view.querySelector('#notesArchive');if(old)old.remove();
  const box=document.createElement('div');box.id='notesArchive';box.style.marginTop='22px';
  const items=S.notesArchive;
  box.innerHTML='<h2>Archived notes ('+items.length+')</h2>'+(items.length?items.map(n=>`<div class="card"><div class="mu" style="font-size:12px">${esc(fmt(n.ts))} · archived ${esc(fmt(n.archivedAt))}</div><div style="white-space:pre-wrap;margin:6px 0">${esc(n.t)}</div><div class="bar"><button class="chip" data-note-restore="${n.id}">Restore</button><button class="chip" data-note-adel="${n.id}">Delete</button></div></div>`).join(''):'<div class="mu">Nothing archived.</div>');
  view.appendChild(box);
 }
 document.addEventListener('click',e=>{
  const a=e.target.closest('[data-note-archive]');
  if(a){const id=a.dataset.noteArchive;const n=S.notes.find(x=>x.id===id);if(!n)return;
   S.notes=S.notes.filter(x=>x.id!==id);S.notesArchive.unshift(Object.assign({},n,{archivedAt:new Date().toISOString()}));
   persistAll();if(typeof showUndo==='function')showUndo('Note archived',()=>{S.notesArchive=S.notesArchive.filter(x=>x.id!==id);S.notes.push(n);persistAll();render()});
   render();return}
  const r=e.target.closest('[data-note-restore]');
  if(r){const n=S.notesArchive.find(x=>x.id===r.dataset.noteRestore);if(n){S.notesArchive=S.notesArchive.filter(x=>x.id!==n.id);const {archivedAt,...back}=n;S.notes.push(back);persistAll();render();if(typeof toast==='function')toast('Note restored')}return}
  const d=e.target.closest('[data-note-adel]');
  if(d){S.notesArchive=S.notesArchive.filter(x=>x.id!==d.dataset.noteAdel);persistAll();render();return}
 });
 const origRender=window.render;
 window.render=function(){const r=origRender.apply(this,arguments);
  const on=(document.querySelector('.sec.on')||{}).id;
  if(on==='s-notes'){decorateNoteButtons();archivePanel()}
  return r};
 const origTab=window.tab;
 window.tab=function(k){const r=origTab.apply(this,arguments);if(k==='notes')setTimeout(()=>{decorateNoteButtons();archivePanel()},0);return r};
})();
</script>
<script id="v41-delete-forever">
/* v41: explicit "Delete forever" for archived notes and to-dos, with confirmation */
(function(){
 const label=()=>{
  document.querySelectorAll('[data-arch-del]').forEach(b=>{b.textContent='Delete forever';b.style.color='var(--dn)'});
  document.querySelectorAll('[data-note-adel]').forEach(b=>{b.textContent='Delete forever';b.style.color='var(--dn)'});
 };
 document.addEventListener('click',e=>{
  const b=e.target.closest('[data-arch-del],[data-note-adel]');
  if(!b)return;
  if(!confirm('Delete forever? This cannot be undone.')){e.stopImmediatePropagation();e.preventDefault()}
 },true);
 const origRender=window.render;
 window.render=function(){const r=origRender.apply(this,arguments);setTimeout(label,0);return r};
 const origTab=window.tab;
 window.tab=function(){const r=origTab.apply(this,arguments);setTimeout(label,30);return r};
})();
</script>
<script id="v42-google-signin">
/* v42: Continue with Google, using Firebase's redirect sign-in */
(function(){
 async function googleSignIn(){
  try{
   await fbLoad();
   const provider=new fbA.GoogleAuthProvider();
   await fbA.signInWithRedirect(fbAuth,provider);
  }catch(e){
   const m=(e&&e.code==='auth/operation-not-allowed')?'Turn on Google sign-in in Firebase first (Authentication → Sign-in method).':'Could not sign in with Google. Please try again.';
   if(typeof toast==='function')toast(m);
  }
 }
 window.fhGoogleSignIn=googleSignIn;
 function addButton(){
  const btn=document.querySelector('button[onclick="fhSignIn()"]');
  if(!btn||document.getElementById('googleSignInBtn'))return;
  const b=document.createElement('button');
  b.id='googleSignInBtn';b.className='chip';b.style.marginTop='8px';
  b.textContent='Continue with Google';b.onclick=googleSignIn;
  btn.parentElement.insertAdjacentElement('afterend',b);
 }
 const so=window.setOpen;
 window.setOpen=function(v){so.apply(this,arguments);if(v)setTimeout(addButton,60)};
})();
</script>
<script id="v44-archive-guard">
/* v44: keep archives when a shared copy arrives without them */
(function(){
 const KEYS=['notesArchive','choreArchive','lastShop'];
 const CACHE='fh_archive_cache';
 const readCache=()=>{try{return JSON.parse(localStorage.getItem(CACHE))||{}}catch(e){return {}}};
 const writeCache=()=>{const c={};KEYS.forEach(k=>{c[k]=Array.isArray(S[k])?S[k]:[]});try{localStorage.setItem(CACHE,JSON.stringify(c))}catch(e){}};
 KEYS.forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 const origSave=window.save;
 window.save=function(){KEYS.forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});writeCache();return origSave.apply(this,arguments)};
 const origPersist=window.persist;
 if(typeof origPersist==='function'){
  window.persist=function(){KEYS.forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});writeCache();return origPersist.apply(this,arguments)};
 }
 const origRender=window.render;
 window.render=function(){
  const c=readCache();
  KEYS.forEach(k=>{if(!Array.isArray(S[k])){S[k]=Array.isArray(c[k])?c[k]:[]}});
  return origRender.apply(this,arguments);
 };
 writeCache();
})();
</script>
